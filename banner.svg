  <text x="44" y="206" class="m" font-size="20" fill="#8B7FD6">~ ❯</text><text class="m" font-size="20" fill="#374151"><tspan class="p0" x="104" y="206">web, e-commerce &amp; UI/UX</tspan><tspan class="p1" x="104" y="206">tiendas en Shopify &amp; Tiendanube</tspan><tspan class="p2" x="104" y="206">apps móviles en Kotlin</tspan><tspan class="p3" x="104" y="206">sitios en WordPress</tspan></text>
