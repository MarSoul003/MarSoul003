      <stop offset="0" stop-color="#E8F5EF"/><stop offset="0.55" stop-color="#EEE9FB"/><stop offset="1" stop-color="#FBEAF1"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1F2937" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .t{font-family:-apple-system,'Inter','Segoe UI',Helvetica,Arial,sans-serif}
