  .p0{animation:cy 12s infinite;animation-delay:0s;opacity:0}.p1{animation:cy 12s infinite;animation-delay:3s;opacity:0}.p2{animation:cy 12s infinite;animation-delay:6s;opacity:0}.p3{animation:cy 12s infinite;animation-delay:9s;opacity:0}@keyframes cy{0%{opacity:0;transform:translateY(6px)}4%,22%{opacity:1;transform:translateY(0)}26%,100%{opacity:0;transform:translateY(-6px)}}</style>
  <rect width="900" height="300" rx="22" fill="url(#bg)"/>
  <rect width="900" height="300" rx="22" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="21.5" fill="none" stroke="#1F2937" stroke-opacity="0.1"/>

  <rect x="44" y="40" width="238" height="32" rx="16" fill="#fff" fill-opacity="0.75" stroke="#1F2937" stroke-opacity="0.08"/>
